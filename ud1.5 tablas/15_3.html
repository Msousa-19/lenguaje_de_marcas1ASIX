<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú de cafetería</title>
    <style type="text/css">
        table {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th {
            border: 1px solid black;
            background-color: lightblue;
            text-align: center;
        }
        td {
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <caption>Menú de cafetería</caption>
        <tr>
            <th>Producto</th>
            <th>Tamaño</th>
            <th>Precio</th>
        </tr>
        <tr>
            <th colspan="3">Desayunos</th>
        </tr>
        <tr>
            <td rowspan="2">Café con leche</td>
            <td>Pequeño</td>
            <td>1,50 €</td>
        </tr>
        <tr>
            <td>Grande</td>
            <td>2,00 €</td>
        </tr>
        <tr>
            <td>Tostada con tomate</td>
            <td>Única</td>
            <td>2,20 €</td>
        </tr>
        <tr>
            <td>Zumo de naranja</td>
            <td>Único</td>
            <td>2,50 €</td>
        </tr>
    </table>
</body>
</html>
