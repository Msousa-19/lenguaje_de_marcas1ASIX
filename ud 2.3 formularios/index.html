<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario de alta de usuario</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<h2>Formulario de alta de usuario</h2>
<form action="#" method="POST" enctype="multipart/form-data">
<table>
<tr>
<td colspan="2" class="c"><label for="usuario">Identificador de nuevo usuario</label>
<input type="text" name="usuario" id="usuario" value="usu_012345" readonly title="Identificador asignado automáticamente"></td>
</tr>
<tr>
<td><label for="nombre">Nombre:</label> <input type="text" name="nombre" id="nombre" title="Escribe tu nombre"></td>
<td><label for="apellidos">Apellidos:</label> <input type="text" name="apellidos" id="apellidos" title="Escribe tus apellidos"></td>
</tr>
<tr>
<td><label for="pass1">Contraseña:</label> <input type="password" name="pass1" id="pass1" title="Escribe tu contraseña"></td>
<td><label for="pass2">Confirmar contraseña:</label> <input type="password" name="pass2" id="pass2" title="Repite tu contraseña"></td>
</tr>
<tr>
<td colspan="2"><label for="email">Email:</label> <input type="email" name="email" id="email" size="60" title="Escribe tu correo electrónico"></td>

</tr>
<tr>
<td><label for="hombre">Sexo:</label></td>
<td><input type="radio" name="sexo" id="hombre" value="h" title="Hombre"><label for="hombre" class="op">Hombre</label>
<input type="radio" name="sexo" id="mujer" value="m" title="Mujer" checked><label for="mujer" class="op">Mujer</label></td>
</tr>
<tr>
<td><label for="deportes">Aficiones:</label></td>
<td><input type="checkbox" name="deportes" id="deportes" value="ok" title="Deportes"><label for="deportes" class="op">Deportes</label><br>
<input type="checkbox" name="lectura" id="lectura" value="ok" title="Lectura" checked><label for="lectura" class="op">Lectura</label><br>
<input type="checkbox" name="cine" id="cine" value="ok" title="Cine"><label for="cine" class="op">Cine</label></td>
</tr>
<tr>
<td><label for="pais">País:</label></td>
<td><select name="pais" id="pais" title="Selecciona tu país">
<option value="es" selected>España</option>
<option value="fr">Francia</option>
<option value="pt">Portugal</option>
</select></td>
</tr>
<tr>
<td><label for="foto">Subir su foto:</label></td>
<td><input type="file" name="foto" id="foto" title="Selecciona tu foto"></td>
</tr>
<tr>
<td><label for="comentarios">Comentarios personales:</label></td>
<td><textarea name="comentarios" id="comentarios" cols="40" rows="5" placeholder="Escriba aquí sus comentarios" title="Escribe tus comentarios"></textarea></td>
</tr>
<tr>
<td class="c"><input type="reset" name="breset" value="Resetear"></td>
<td class="c"><input type="submit" name="benviar" value="Enviar"></td>
</tr>
</table>
</form>
</body>
</html>
