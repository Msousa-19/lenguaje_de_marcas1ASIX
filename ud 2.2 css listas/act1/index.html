<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tortilla de patatas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Hacer una tortilla de patatas</h1>
  <h2>Ingredientes</h2>
  <ul>
    <li>4 patatas</li>
    <li>6 huevos</li>
    <li>Aceite de oliva</li>
    <li>Sal</li>
  </ul>
  <h2>Elaboración</h2>
  <ol>
    <li>Pelar y cortar las patatas.</li>
    <li>Freírlas las patatas</li>
    <li>Batir los huevos y mezclar.</li>
    <li>Hacer por un lado.</li>
    <li>Dar la vuelta y hacela por el otro.</li>
  </ol>
</body>
</html>
