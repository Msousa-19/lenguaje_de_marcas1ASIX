<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de productos</title>
    <style type="text/css">
        table {
            border: 1px solid black;
            border-spacing: 8px;
            empty-cells: hide;
        }
        caption {
            caption-side: bottom;
        }
        th {
            border: 1px solid black;
            background-color: lightblue;
        }
        td {
            border: 1px solid black;
        }
        .categoria {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <table>
        <caption>Inventario de productos</caption>
        <thead>
            <tr>
                <th>Categoría</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio unitario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="categoria" rowspan="2">Periféricos</td>
                <td>Teclado</td>
                <td>2</td>
                <td>15,00 €</td>
            </tr>
            <tr>
                <td>Ratón</td>
                <td>3</td>
                <td>8,00 €</td>
            </tr>
            <tr>
                <td class="categoria" rowspan="3">Almacenamiento</td>
                <td>Disco SSD</td>
                <td>1</td>
                <td>40,00 €</td>
            </tr>
            <tr>
                <td>Memoria USB</td>
                <td>5</td>
                <td>6,00 €</td>
            </tr>
            <tr>
                <td>Tarjeta SD</td>
                <td>4</td>
                <td>7,00 €</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Total</th>
                <td>15</td>
                <td></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
